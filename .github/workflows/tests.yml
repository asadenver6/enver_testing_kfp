name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install kfp
          pip install pandas pyarrow numpy joblib scikit-learn xgboost
          pip install google-cloud-bigquery google-cloud-aiplatform google-cloud-storage google-cloud-build

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/test_ingest_integration.py

  bigquery-integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install kfp
          pip install pandas pyarrow numpy joblib scikit-learn xgboost
          pip install google-cloud-bigquery google-cloud-aiplatform google-cloud-storage google-cloud-build db-dtypes

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Run BigQuery integration test
        env:
          RUN_BQ_INTEGRATION: "1"
          GCP_PROJECT_ID: "${{ secrets.GCP_PROJECT_ID }}"
        run: pytest tests/test_ingest_integration.py -v